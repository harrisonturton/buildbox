syntax = "proto3";

package buildbox.admin.v1;

// Inspects and manages a running buildbox server.
service Admin {
  // Report the server's storage usage and execution load.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // List the actions that are queued or running.
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);

  // Import a container image as an artifact, replacing any artifact with
  // the same name. The image's manifest, config and layers must already be
  // in the CAS.
  rpc ImportContainerImage(ImportContainerImageRequest) returns (ImportContainerImageResponse);

  // List the stored artifacts.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);

  // Delete an artifact. Actions already using it are unaffected.
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  // The version of buildbox the server is running.
  string version = 1;

  // How long the server has been running.
  uint64 uptime_seconds = 2;

  StorageUsage cas = 3;
  StorageUsage action_cache = 4;
  ExecutionStatus execution = 5;
  StorageUsage artifacts = 6;
}

message StorageUsage {
  // Where the data is stored, e.g. a directory.
  string location = 1;

  // How many blobs or entries are stored.
  uint64 entries = 2;

  // Their total size.
  uint64 bytes = 3;
}

message ExecutionStatus {
  uint32 max_concurrent_actions = 1;
  uint32 running_actions = 2;
  uint32 queued_actions = 3;
}

message ListActionsRequest {}

message ListActionsResponse {
  // The actions, oldest first.
  repeated ActionInfo actions = 1;
}

message ActionInfo {
  // Identifies the action while it is queued or running.
  uint64 id = 1;

  // The digest of the action, as "{hash}/{size}".
  string action_digest = 2;

  ActionState state = 3;

  // The command line.
  repeated string arguments = 4;

  // How long ago the action was queued.
  uint64 queued_millis = 5;

  // How long the action has been running, or 0 if it is queued.
  uint64 running_millis = 6;

  // The name of the environment the action runs in.
  string environment = 7;
}

enum ActionState {
  ACTION_STATE_UNSPECIFIED = 0;
  ACTION_STATE_QUEUED = 1;
  ACTION_STATE_RUNNING = 2;
}

message ImportContainerImageRequest {
  // The artifact's name, e.g. "ubuntu:24.04".
  string name = 1;

  // The digest of the image's manifest, as "{hash}/{size}".
  string manifest_digest = 2;
}

message ImportContainerImageResponse {
  Artifact artifact = 1;
}

message ListArtifactsRequest {}

message ListArtifactsResponse {
  // The artifacts, ordered by name.
  repeated Artifact artifacts = 1;
}

message DeleteArtifactRequest {
  string name = 1;
}

message DeleteArtifactResponse {}

message Artifact {
  string name = 1;
  ArtifactKind kind = 2;

  // Identifies the artifact's contents, as "{hash}/{size}". For a container
  // image, this is the digest of its manifest.
  string digest = 3;

  // How much space the artifact takes up.
  uint64 size_bytes = 4;

  // When the artifact was imported, in milliseconds since the Unix epoch.
  uint64 imported_at_unix_millis = 5;
}

enum ArtifactKind {
  ARTIFACT_KIND_UNSPECIFIED = 0;
  ARTIFACT_KIND_CONTAINER_IMAGE = 1;
}
