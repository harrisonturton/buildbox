syntax = "proto3";

package buildbox.admin.v1;

// Inspects and manages a running buildbox server.
service Admin {
  // Report the server's storage usage and execution load.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // List the actions that are queued or running.
  rpc ListActions(ListActionsRequest) returns (ListActionsResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  // The version of buildbox the server is running.
  string version = 1;

  // How long the server has been running.
  uint64 uptime_seconds = 2;

  StorageUsage cas = 3;
  StorageUsage action_cache = 4;
  ExecutionStatus execution = 5;
}

message StorageUsage {
  // Where the data is stored, e.g. a directory.
  string location = 1;

  // How many blobs or entries are stored.
  uint64 entries = 2;

  // Their total size.
  uint64 bytes = 3;
}

message ExecutionStatus {
  uint32 max_concurrent_actions = 1;
  uint32 running_actions = 2;
  uint32 queued_actions = 3;
}

message ListActionsRequest {}

message ListActionsResponse {
  // The actions, oldest first.
  repeated ActionInfo actions = 1;
}

message ActionInfo {
  // Identifies the action while it is queued or running.
  uint64 id = 1;

  // The digest of the action, as "{hash}/{size}".
  string action_digest = 2;

  ActionState state = 3;

  // The command line.
  repeated string arguments = 4;

  // How long ago the action was queued.
  uint64 queued_millis = 5;

  // How long the action has been running, or 0 if it is queued.
  uint64 running_millis = 6;
}

enum ActionState {
  ACTION_STATE_UNSPECIFIED = 0;
  ACTION_STATE_QUEUED = 1;
  ACTION_STATE_RUNNING = 2;
}
